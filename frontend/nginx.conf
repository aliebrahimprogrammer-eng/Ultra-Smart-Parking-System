# Same routing as the dev proxy in vite.config.js
server {
    listen 80;
    root /usr/share/nginx/html;

    location /auth {
        proxy_pass http://auth-service:8081;
    }

    location /lots {
        proxy_pass http://parking-service:8082;
    }

    location /spots {
        proxy_pass http://parking-service:8082;
    }

    location /api {
        proxy_pass http://reservation-service:8083;
    }

    # Page refreshes on routes like /dashboard still load the React app
    location / {
        try_files $uri /index.html;
    }
}
